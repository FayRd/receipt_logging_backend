version: "3.8"

services:
  receipt-logging-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receipt_logging_backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8085
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:-redis://localhost:6379}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-3.6-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-google/gemini-2.5-flash}
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-google/gemini-2.5-flash}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost","http://localhost:3000","http://localhost:8085"]}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_SCAN_PER_MINUTE=${RATE_LIMIT_SCAN_PER_MINUTE:-5}
      - RATE_LIMIT_CHAT_PER_MINUTE=${RATE_LIMIT_CHAT_PER_MINUTE:-10}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      - RATE_LIMIT_CRUD_PER_MINUTE=${RATE_LIMIT_CRUD_PER_MINUTE:-60}
      - RATE_LIMIT_HEALTH_PER_MINUTE=${RATE_LIMIT_HEALTH_PER_MINUTE:-120}
      - MAX_IMAGE_SIZE_BYTES=${MAX_IMAGE_SIZE_BYTES:-10485760}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.8}
      - RAG_RECENT_RECEIPTS_LIMIT=${RAG_RECENT_RECEIPTS_LIMIT:-100}
      - RAG_HISTORY_MESSAGES_LIMIT=${RAG_HISTORY_MESSAGES_LIMIT:-50}
      - MAX_CONVERSATIONS_PER_IDENTITY=${MAX_CONVERSATIONS_PER_IDENTITY:-10}
      - SSE_POLL_INTERVAL_SECONDS=${SSE_POLL_INTERVAL_SECONDS:-1.0}
      - SSE_BATCH_TIMEOUT_SECONDS=${SSE_BATCH_TIMEOUT_SECONDS:-300}
      - REDIS_JOB_TTL_SECONDS=${REDIS_JOB_TTL_SECONDS:-600}
      - ENABLE_FILE_LOGGING=${ENABLE_FILE_LOGGING:-true}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-app.log}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - ENABLE_CONSOLE_LOGGING=${ENABLE_CONSOLE_LOGGING:-true}
      - DISCORD_FEEDBACK_WEBHOOK_URL=${DISCORD_FEEDBACK_WEBHOOK_URL:-}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-no-reply@taskcollab.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-SancFund}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-dGVzdC1zZWNyZXQtZW5jcnlwdGlvbi1rZXktMzJieXRlcw==}
      - ENFORCE_DATA_ENCRYPTION=${ENFORCE_DATA_ENCRYPTION:-true}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger_dashboard
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4318:4318"   # OTLP HTTP Receiver
