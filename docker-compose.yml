version: "3.8"

services:
  receipt-logging-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receipt_logging_backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8085
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
